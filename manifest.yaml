apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk258-order-frontend
  namespace: class-8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk258-order-frontend
  template:
    metadata:
      labels:
        app: sk258-order-frontend
    spec:
      containers:
      - name: frontend
        image: skala-registry.skala-ai.com/class-8/sk258-order-frontend:bootstrap
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sk258-order-frontend
  namespace: class-8
spec:
  selector:
    app: sk258-order-frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sk258-order-frontend
  namespace: class-8
spec:
  ingressClassName: public-nginx
  rules:
  - host: sk258-orders.class-8.skala-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sk258-order-frontend
            port:
              number: 80
  tls:
  - hosts:
    - sk258-orders.class-8.skala-ai.com
    secretName: wildcard-class-8-skala-ai-com-tls
